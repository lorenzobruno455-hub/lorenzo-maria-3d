<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Aurora — captura dos GLBs</title>
<style>@font-face{font-family:Barlow;src:url('/fonts/BarlowCondensed-Bold.woff')}body{margin:0;background:#90d3eb}canvas{display:block}aside{position:absolute;left:32px;top:24px;font:700 32px Barlow,sans-serif;color:#141824}small{display:block;font:16px sans-serif;margin-top:8px}.names{position:absolute;bottom:35px;left:0;width:100%;display:flex;justify-content:space-evenly;font:700 28px Barlow;color:#141824}</style>
<aside>PROJECT AURORA · 0.7A<small>Avatares fictícios personalizáveis · GLBs originais gerados no Blender</small></aside><div class="names"><span>LORENZO</span><span>MARIA</span></div>
<script type="module">
import * as THREE from 'three';import {Resources} from '/src/systems/resources.js';import {GLBAssets} from '/src/systems/asset-pipeline.js';import {Character} from '/src/systems/character.js';import {InkOutlines} from '/src/systems/ink-outlines.js';import {CHARACTER_ASSETS} from '/src/character-assets.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#90d3eb');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1.3);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,30);camera.position.set(0,1.12,4.5);camera.lookAt(0,1.02,0);
scene.add(new THREE.HemisphereLight('#fff5dc','#6a7c9b',2.1));const sun=new THREE.DirectionalLight('#fff0cf',2.4);sun.position.set(-4,7,5);scene.add(sun);
const r=new Resources(),pool=new GLBAssets(r);const actors=[];for(const [name,x,angle]of [['lorenzo',-.55,.14],['maria',.55,-.18]]){const a=new Character(r,name==='maria'?'#8faaa0':'#dbdbcf');a.player=true;a.root.position.x=x;a.root.rotation.y=angle;scene.add(a.root);if(!new URLSearchParams(location.search).has('before'))await a.loadGLB(CHARACTER_ASSETS[name].url,CHARACTER_ASSETS[name].clips,pool,CHARACTER_ASSETS[name]);actors.push(a);}
const ink=new InkOutlines(scene,r,actors);ink.update('high',new THREE.Vector3());const clock=new THREE.Clock();function render(){const dt=Math.min(.05,clock.getDelta());for(const a of actors)a.update(dt);renderer.render(scene,camera);requestAnimationFrame(render);}render();window.ready=true;
</script></html>
