name: Project Aurora validation

on:
  push:
    branches:
      - feat/colorbeat-v06-foundation
      - feat/aurora-07b
  pull_request:
    branches:
      - main
      - feat/aurora-07a
      - feat/aurora-081-colorbeat-unified

concurrency:
  group: colorbeat-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Attach screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorbeat-reference-captures
          path: |
            docs/captures/07b/*.png
            docs/captures/081/*.png
            docs/captures/082-m1/*.jpg
          if-no-files-found: ignore
          retention-days: 5

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Each spec belongs to exactly one shard; workers/timeouts/assertions stay intact.
      - run: npm test -- --shard=${{ matrix.shard }}/2 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      - name: Attach browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorbeat-browser-${{ matrix.shard }}
          path: |
            test-results/
            docs/captures/07b/*.png
          if-no-files-found: ignore
          retention-days: 5
