name: Project Aurora validation

on:
  push:
    branches:
      - feat/colorbeat-v06-foundation
      - feat/aurora-07b
  pull_request:
    # Reporting-only follow-ups do not repeat the complete browser regression.
    paths-ignore:
      - 'docs/**'
    branches:
      - main
      - feat/aurora-07a
      - feat/aurora-081-colorbeat-unified
      - feat/aurora-082-living-school
      - feat/aurora-comic-overdrive-p1-p2
      - feat/aurora-comic-overdrive-20-d2

concurrency:
  group: colorbeat-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Attach screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorbeat-reference-captures
          path: |
            docs/captures/07b/*.png
            docs/captures/081/*.png
            docs/captures/082-m1/*.jpg
          if-no-files-found: ignore
          retention-days: 5

  browser:
    needs: validate
    runs-on: ubuntu-latest
    # Keep individual test limits; allow setup/artifact time around the 17.6m shard.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Real walking adds travel time. Four disjoint test shards retain one worker each.
      - run: npm test -- --shard=${{ matrix.shard }}/4 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      - name: Attach browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorbeat-browser-${{ matrix.shard }}
          path: |
            test-results/
            docs/captures/07b/*.png
          if-no-files-found: ignore
          retention-days: 5
