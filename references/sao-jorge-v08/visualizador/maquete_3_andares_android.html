<title>Colégio São Jorge | Maquete 3D Interativa</title>
<style>
  :root{color-scheme:light;--ink:#0c1d35;--blue:#2f5d9a;--cream:#f7f6f2;--line:#dce4ef;--white:#fff;--shadow:0 18px 44px rgba(10,35,64,.18)}
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#dae8ef}
  #stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 56% 36%,#f9f7f0 0%,#e6ecf2 54%,#c7dce9 100%)}
  canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}canvas:active{cursor:grabbing}
  .top{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;align-items:flex-start;gap:12px;z-index:5;pointer-events:none}

  .viewactions{display:flex;gap:7px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:end}
  .tool{height:42px;min-width:42px;border:1px solid #d7e3ee;background:rgba(255,255,255,.91);border-radius:14px;box-shadow:0 8px 20px rgba(10,35,64,.10);font-size:17px;font-weight:800;color:#203a5a;padding:0 10px;cursor:pointer}

  .floatingHint{position:fixed;top:112px;left:12px;z-index:4;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:10px 12px;border-radius:12px;pointer-events:none;font-size:12px;color:#496079;box-shadow:0 7px 22px rgba(19,55,82,.07)}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .roomtag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:rgba(255,255,255,.91);color:#28415e;border:1px solid rgba(151,168,186,.55);box-shadow:0 2px 8px rgba(17,46,74,.13);border-radius:8px;padding:3px 6px;white-space:nowrap;max-width:115px;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:750;letter-spacing:-.012em;text-align:center}
  .floorbar{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(590px,calc(100vw - 24px));padding:11px;z-index:7;border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);background:rgba(248,250,252,.96);backdrop-filter:blur(18px);border-radius:22px}
  .floorbar .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .floorbar button{appearance:none;background:#e7edf4;border:1px solid #dde6f0;border-radius:12px;min-height:48px;padding:8px 4px;font-size:clamp(10px,2.7vw,13px);font-weight:800;color:#425a74;cursor:pointer;line-height:1.2}
  .floorbar button[aria-pressed="true"]{color:white;background:#2f5d9a;border-color:#2f5d9a;box-shadow:0 6px 14px #2f5d9a44}
  .floorbar .sub{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 5px 1px;font-size:11px;color:#6c7e93;line-height:1.3}

  #detail{position:fixed;left:14px;right:14px;bottom:126px;z-index:6;max-width:440px;margin:auto;background:rgba(255,255,255,.96);padding:14px 18px;border:1px solid #dae4ef;border-radius:18px;box-shadow:var(--shadow);display:none}

  #closeDetail{float:right;border:0;border-radius:8px;padding:5px 9px;background:#e9eef5;color:#344a66;font-size:16px;cursor:pointer}
  .legend{position:fixed;right:13px;bottom:133px;z-index:4;background:rgba(255,255,255,.8);border:1px solid #e6edf3;backdrop-filter:blur(10px);border-radius:14px;padding:9px 11px;display:flex;align-items:center;gap:9px;font-size:10px;font-weight:700;color:#4f6982}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:2px;vertical-align:middle;background:#2d5fa8}
  #message{display:none;position:fixed;inset:20% 10%;z-index:20;padding:20px;background:white;border-radius:15px;text-align:center;box-shadow:var(--shadow)}
  @media(max-width:560px){.top{gap:7px}.brand{padding:10px 11px;border-radius:14px}.viewactions{max-width:105px;gap:5px}.tool{height:37px;min-width:37px;padding:0 8px;font-size:15px;border-radius:12px}.floatingHint{top:105px;font-size:11px;padding:8px 10px}.legend{bottom:136px;right:12px;font-size:9px;gap:6px;padding:8px}.roomtag{font-size:9px;max-width:80px;padding:2px 4px}.floorbar .sub{font-size:10px}}

 return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])}
function multMV(m,v){return [0,1,2,3].map(r=>m[r]*v[0]+m[4+r]*v[1]+m[8+r]*v[2]+m[12+r]*v[3])}
let view,proj;
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.max(2,Math.floor(canvas.clientWidth*dpr)),h=Math.max(2,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);}
function setFloor(f){floor=f;document.querySelectorAll('[data-floor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.floor===f)));
 document.getElementById('floorTitle').textContent=({0:'1º ANDAR · Biblioteca e administração',1:'2º ANDAR · Ciências e laboratórios',2:'3º ANDAR · Salão multiuso',all:'TRÊS ANDARES · Visão explodida'})[f];
 camera.tar[0]=0;camera.tar[2]=0;camera.tar[1]=(f==='all'?5.7:Number(f)*3.35+.4);camera.dist=(canvas.clientWidth<650?(f==='all'?112:95):(f==='all'?72:62));document.getElementById('detail').classList.remove('open');render();}
function getExplode(f){return floor==='all'?f*1.7:0}
function mat(){resize();let a=canvas.width/canvas.height;
 camera.eye=[camera.tar[0]+camera.dist*Math.sin(camera.az)*Math.cos(camera.el),camera.tar[1]+camera.dist*Math.sin(camera.el),camera.tar[2]+camera.dist*Math.cos(camera.az)*Math.cos(camera.el)];
 view=lookAt(camera.eye,camera.tar);proj=perspective(PI/4.1,a,.3,210);gl.uniformMatrix4fv(uni.view,false,view);gl.uniformMatrix4fv(uni.proj,false,proj);}
const labelsEl=document.getElementById('labels');const labelNodes=[];
for(const room of data.rooms){let node=document.createElement('div');node.className='roomtag';node.textContent=room.name;labelsEl.appendChild(node);labelNodes.push({room,node});}
function updateLabels(){for(const {room,node} of labelNodes){if(floor==='all'||Number(floor)!==room.floor){node.style.display='none';continue;}
 let p=[room.x,room.floor*3.35+getExplode(room.floor)+1.75,room.z,1];let c=multMV(proj,multMV(view,p));if(c[3]<=0){node.style.display='none';continue;}
 let x=(c[0]/c[3]*.5+.5)*canvas.clientWidth,y=(.5-c[1]/c[3]*.5)*canvas.clientHeight;
 if(x<12||x>canvas.clientWidth-12||y<115||y>canvas.clientHeight-115){node.style.display='none';continue}
 node.style.display='block';node.style.transform='translate(-50%,-50%) translate('+Math.round(x)+'px,'+Math.round(y)+'px)';}}
function render(){mat();gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);
 for(let f=0;f<3;f++)if(floor==='all'||Number(floor)===f){let z=floors[f];gl.uniform1f(uni.base,f*3.35);gl.uniform1f(uni.explode,getExplode(f));gl.bindVertexArray(z.vao);gl.drawElementsInstanced(gl.TRIANGLES,inds.length,gl.UNSIGNED_SHORT,0,z.count)}
 gl.bindVertexArray(null);updateLabels();}
const pCenter=()=>{const p=[...pointers.values()];return p.length?{x:p.reduce((s,x)=>s+x.x,0)/p.length,y:p.reduce((s,x)=>s+x.y,0)/p.length}:null};
const pDist=()=>{let p=[...pointers.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
function onDown(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});hasMoved=false;oldDistance=pDist();oldCenter=pCenter();}
function onMove(e){if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(Math.abs(dx)+Math.abs(dy)>1.6)hasMoved=true;
 if(pointers.size===1){camera.az-=dx*.007;camera.el=clamp(camera.el+dy*.0065,.20,1.47);camera.top=false;document.getElementById('topBtn').setAttribute('aria-pressed','false')}
 else if(pointers.size>=2){const d=pDist();if(oldDistance>5&&d>5)camera.dist=clamp(camera.dist*oldDistance/d,16,105);oldDistance=d;}
 render();}
function onUp(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);oldDistance=pDist();if(!hasMoved&&e.type==='pointerup')pick(e.clientX,e.clientY);render()}
canvas.addEventListener('pointerdown',onDown);canvas.addEventListener('pointermove',onMove);canvas.addEventListener('pointerup',onUp);canvas.addEventListener('pointercancel',onUp);
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=clamp(camera.dist*Math.exp(e.deltaY*.001),16,105);render()},{passive:false});
function pick(cx,cy){const ndx=cx/canvas.clientWidth*2-1,ndy=1-cy/canvas.clientHeight*2;
 const forward=normalize(camera.tar.map((v,i)=>v-camera.eye[i]));const right=normalize(cross(forward,[0,1,0]));const up=cross(right,forward);
 const scale=Math.tan(PI/8.2),ratio=canvas.clientWidth/canvas.clientHeight;
 const ray=normalize(forward.map((x,i)=>x+right[i]*ndx*ratio*scale+up[i]*ndy*scale));
 let choices=(floor==='all'?[2,1,0]:[Number(floor)]),found=null;
 for(let f of choices){let py=f*3.35+getExplode(f)+.1;if(Math.abs(ray[1])<.0001)continue;let t=(py-camera.eye[1])/ray[1];if(t<0)continue;
 let x=camera.eye[0]+ray[0]*t,z=camera.eye[2]+ray[2]*t;
 let rr=data.rooms.find(r=>r.floor===f&&x>r.x1&&x<r.x2&&z>r.z1&&z<r.z2);
 if(rr){found=rr;break}}
 if(found){document.getElementById('detailTitle').textContent=found.name;document.getElementById('detailText').textContent=['1º andar','2º andar','3º andar'][found.floor]+' • Espaço ilustrativo inspirado no seu desenho, com dimensões aproximadas para o jogo.';document.getElementById('detail').classList.add('open')}
}
document.querySelectorAll('[data-floor]').forEach(b=>b.addEventListener('click',()=>setFloor(b.dataset.floor)));
document.getElementById('resetBtn').addEventListener('click',()=>{camera.az=.45;camera.el=.98;camera.top=false;document.getElementById('topBtn').setAttribute('aria-pressed','false');setFloor(floor)});
document.getElementById('topBtn').addEventListener('click',()=>{camera.top=!camera.top;camera.el=camera.top?1.47:.98;camera.az=camera.top?0:.45;document.getElementById('topBtn').setAttribute('aria-pressed',String(camera.top));render()});
document.getElementById('spinBtn').addEventListener('click',()=>{camera.spin=!camera.spin;document.getElementById('spinBtn').setAttribute('aria-pressed',String(camera.spin))});
document.getElementById('closeDetail').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));
let lastTime=0;function tick(time){if(camera.spin){let dt=Math.min(.05,(time-lastTime)/1000||.016);camera.az+=dt*.25;render()}lastTime=time;requestAnimationFrame(tick)}
window.addEventListener('resize',render);window.addEventListener('orientationchange',()=>setTimeout(render,150));
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();document.getElementById('message').style.display='block';document.getElementById('message').textContent='O visualizador 3D foi interrompido pelo Android. Reabra a página para continuar.'});
setFloor('0');requestAnimationFrame(tick);
function startFallback(){
  // Canvas 2D fallback: editable three-dimensional geometric projection, without external code.
  const ctx=canvas.getContext('2d');
  if(!ctx){document.getElementById('message').style.display='block';document.getElementById('message').textContent='Não foi possível iniciar a visualização. Tente abrir no Chrome.';return;}
  const rooms=data.rooms, cubes=data.boxes,palette=data.palette;
  const cam={az:.45,el:.98,dist:90,tar:[0,.45,0],eye:[0,0,0],spin:false,top:false};
  let current='0',touches=new Map(),oldPinch=0,moved=false,drawQueued=false;
  const labelsEl=document.getElementById('labels'),nodes=[];
  for(let room of rooms){let d=document.createElement('div');d.className='roomtag';d.textContent=room.name;labelsEl.appendChild(d);nodes.push({room,d});}
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const norm=v=>{let n=Math.hypot(...v)||1;return v.map(x=>x/n)};
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const colors=palette.map(h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
  let eye,forward,right,up,hf,ww,hh;
  function setup(){
    ww=canvas.clientWidth;hh=canvas.clientHeight;
    const ratio=Math.min(window.devicePixelRatio||1,1.5);
    if(canvas.width!==Math.floor(ww*ratio)||canvas.height!==Math.floor(hh*ratio)){canvas.width=Math.floor(ww*ratio);canvas.height=Math.floor(hh*ratio)}
    ctx.setTransform(ratio,0,0,ratio,0,0);
    const c=Math.cos(cam.el);eye=[cam.tar[0]+cam.dist*Math.sin(cam.az)*c,cam.tar[1]+cam.dist*Math.sin(cam.el),cam.tar[2]+cam.dist*Math.cos(cam.az)*c];
    forward=norm(cam.tar.map((t,i)=>t-eye[i]));right=norm(cross(forward,[0,1,0]));up=cross(right,forward);hf=hh/(2*Math.tan(Math.PI/8.2));
  }
  function lift(f){return current==='all'?f*1.7:0}
  function project(p){const d=[p[0]-eye[0],p[1]-eye[1],p[2]-eye[2]],depth=dot(d,forward);
    if(depth<=.1)return null;
    return [ww/2+dot(d,right)*hf/depth,hh/2-dot(d,up)*hf/depth,depth];
  }
  const points=(cx,cy,cz,sx,sy,sz,n,positive)=>{
    const a=sx*.5,b=sy*.5,c=sz*.5;
    let pts;
    if(n===0){let x=cx+(positive?a:-a);pts=[[x,cy-b,cz-c],[x,cy-b,cz+c],[x,cy+b,cz+c],[x,cy+b,cz-c]]}
    if(n===1){let y=cy+(positive?b:-b);pts=[[cx-a,y,cz-c],[cx+a,y,cz-c],[cx+a,y,cz+c],[cx-a,y,cz+c]]}
    if(n===2){let z=cz+(positive?c:-c);pts=[[cx-a,cy-b,z],[cx+a,cy-b,z],[cx+a,cy+b,z],[cx-a,cy+b,z]]}
    return pts;
  };
  let shadeCache=new Map();
  function shaded(idx,orientation){const k=idx*6+orientation;if(shadeCache.has(k))return shadeCache.get(k);
    let col=colors[idx],fac=[.78,.88,.96,.95,.92,.75][orientation];let s='rgb('+col.map(v=>Math.min(255,Math.round(v*fac))).join(',')+')';shadeCache.set(k,s);return s;}
  function drawNow(){drawQueued=false;setup();ctx.clearRect(0,0,ww,hh);
    const drawFloors=current==='all'?[0,1,2]:[Number(current)];
    const polygons=[];
    for(let f of drawFloors){const cyShift=f*3.35+lift(f);
      for(let b of cubes){if(b[0]!==f)continue;
        const cx=b[1],cy=b[2]+cyShift,cz=b[3],sx=b[4],sy=b[5],sz=b[6];
        const distance=Math.hypot(eye[0]-cx,eye[1]-cy,eye[2]-cz);if(distance>cam.dist+31)continue;
        // Render three camera-facing faces of each prism; far faces are hidden.
        for(let axis=0;axis<3;axis++){
          let positive=eye[axis]>(axis===0?cx:axis===1?cy:cz),pp=points(cx,cy,cz,sx,sy,sz,axis,positive);
          let proj=pp.map(project);if(proj.some(x=>!x))continue;
          if(proj.every(p=>p[0]<-50)||proj.every(p=>p[0]>ww+50)||proj.every(p=>p[1]<-50)||proj.every(p=>p[1]>hh+50))continue;
          let depth=proj.reduce((a,p)=>a+p[2],0)/4;
          polygons.push({p:proj,d:depth,priority:(b[2]<.12&&b[5]<.5)?0:1,color:shaded(b[7],axis*2+(positive?0:1))});
        }
      }
    }
    polygons.sort((a,b)=>a.priority-b.priority||b.d-a.d);
    ctx.lineWidth=.32;ctx.strokeStyle='rgba(22,45,70,.13)';
    for(let item of polygons){ctx.fillStyle=item.color;ctx.beginPath();ctx.moveTo(item.p[0][0],item.p[0][1]);for(let i=1;i<4;i++)ctx.lineTo(item.p[i][0],item.p[i][1]);ctx.closePath();ctx.fill();ctx.stroke();}
    for(const {room,d} of nodes){if(current==='all'||Number(current)!==room.floor){d.style.display='none';continue;}
      const pt=project([room.x,room.floor*3.35+lift(room.floor)+1.75,room.z]);
      if(!pt||pt[0]<12||pt[0]>ww-12||pt[1]<115||pt[1]>hh-115){d.style.display='none';continue;}
      d.style.display='block';d.style.transform='translate(-50%,-50%) translate('+Math.round(pt[0])+'px,'+Math.round(pt[1])+'px)';
    }
  }
  function render(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(drawNow)}
  function setFloor(v){current=v;document.querySelectorAll('[data-floor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.floor===v)));
    document.getElementById('floorTitle').textContent=({0:'1º ANDAR · Biblioteca e administração',1:'2º ANDAR · Ciências e laboratórios',2:'3º ANDAR · Salão multiuso',all:'TRÊS ANDARES · Visão explodida'})[v];
    cam.tar=[0,v==='all'?5.7:Number(v)*3.35+.4,0];cam.dist=canvas.clientWidth<650?(v==='all'?112:95):(v==='all'?72:62);document.getElementById('detail').classList.remove('open');render()}
  function pick(x,y){setup();const a=(x/ww*2-1),b=(1-y/hh*2);const ratio=ww/hh,scale=Math.tan(Math.PI/8.2);
    let r=norm(forward.map((v,i)=>v+right[i]*a*ratio*scale+up[i]*b*scale));

      let yy=f*3.35+lift(f)+.08;if(Math.abs(r[1])<.0001)continue;let t=(yy-eye[1])/r[1];if(t<=0)continue;

      let room=rooms.find(a=>a.floor===f&&xx>a.x1&&xx<a.x2&&zz>a.z1&&zz<a.z2);
      if(room){document.getElementById('detailTitle').textContent=room.name;document.getElementById('detailText').textContent=['1º andar','2º andar','3º andar'][f]+' • Maquete artística aproximada para o jogo.';document.getElementById('detail').classList.add('open');break}
    }
  }
  function pd(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(touches.size===2){let p=[...touches.values()];oldPinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}}
  function pm(e){if(!touches.has(e.pointerId))return;let p=touches.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.abs(dx)+Math.abs(dy)>1.5)moved=true;
    if(touches.size===1){cam.az-=dx*.007;cam.el=clamp(cam.el+dy*.0065,.20,1.47);cam.top=false;document.getElementById('topBtn').setAttribute('aria-pressed','false')}
    if(touches.size>=2){let p=[...touches.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(oldPinch>5&&dist>5)cam.dist=clamp(cam.dist*oldPinch/dist,16,105);oldPinch=dist}render()}
  function pu(e){if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);if(!moved&&e.type==='pointerup')pick(e.clientX,e.clientY);render()}
  canvas.addEventListener('pointerdown',pd);canvas.addEventListener('pointermove',pm);canvas.addEventListener('pointerup',pu);canvas.addEventListener('pointercancel',pu);
  canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.001),16,105);render()},{passive:false});
  document.querySelectorAll('[data-floor]').forEach(b=>b.addEventListener('click',()=>setFloor(b.dataset.floor)));
  document.getElementById('resetBtn').addEventListener('click',()=>{cam.az=.45;cam.el=.98;cam.top=false;document.getElementById('topBtn').setAttribute('aria-pressed','false');setFloor(current)});
  document.getElementById('topBtn').addEventListener('click',()=>{cam.top=!cam.top;cam.el=cam.top?1.47:.98;cam.az=cam.top?0:.45;document.getElementById('topBtn').setAttribute('aria-pressed',String(cam.top));render()});
  document.getElementById('spinBtn').addEventListener('click',()=>{cam.spin=!cam.spin;document.getElementById('spinBtn').setAttribute('aria-pressed',String(cam.spin))});
  document.getElementById('closeDetail').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));
  window.addEventListener('resize',render);window.addEventListener('orientationchange',()=>setTimeout(render,180));
  let last=0;function tick(time){if(cam.spin){cam.az+=Math.min(.05,(time-last)/1000||.016)*.21;render()}last=time;requestAnimationFrame(tick)}
  setFloor('0');requestAnimationFrame(tick);
}

})();
